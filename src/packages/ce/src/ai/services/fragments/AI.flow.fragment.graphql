fragment AIFlow on AiGenerationFlow {
    __typename
    name
    startingNodeId
    settings {
        __typename
        id
        value
        cast
        flowSettingIdentifier
    }
    type {
        __typename
        id
        identifier
    }
    nodes {
        __typename
        id
        nextNodeId
        parameters {
            __typename
            id
            cast
            value {
                ...AiGenerationNodeValueRoot
            }
            parameterDefinition {
                __typename
                id
                identifier
            }
        }
        functionDefinition {
            __typename
            id
            identifier
        }
    }
}

fragment AiGenerationReferenceValueFields on AiGenerationReferenceValue {
    __typename
    id
    nodeFunctionId
    inputIndex
    inputTypeIdentifier
    parameterIndex
    referencePath {
        __typename
        path
        arrayIndex
    }
}

fragment AiGenerationSubFlowValueFields on AiGenerationSubFlowValue {
    __typename
    startingNodeId
    signature
    name
    description
    functionDefinition {
        __typename
        id
        identifier
    }
}

# Unrolled to a fixed depth for the same reason as NodeParameterValueRoot in
# Flow.fragment.graphql: the union is recursive and GraphQL cannot express that.
fragment AiGenerationNodeValueLeaf on AiGenerationNodeValue {
    __typename
    ... on AiGenerationLiteralValue {
        __typename
        value
    }
    ... on AiGenerationReferenceValue {
        ...AiGenerationReferenceValueFields
    }
    ... on AiGenerationSubFlowValue {
        ...AiGenerationSubFlowValueFields
    }
}

fragment AiGenerationNodeValueNested on AiGenerationNodeValue {
    __typename
    ... on AiGenerationLiteralValue {
        __typename
        value
        references {
            __typename
            signature
            value {
                ...AiGenerationNodeValueLeaf
            }
        }
    }
    ... on AiGenerationReferenceValue {
        ...AiGenerationReferenceValueFields
    }
    ... on AiGenerationSubFlowValue {
        ...AiGenerationSubFlowValueFields
        parameters {
            __typename
            identifier
            cast
            value {
                ...AiGenerationNodeValueLeaf
            }
        }
    }
}

fragment AiGenerationNodeValueRoot on AiGenerationNodeValue {
    __typename
    ... on AiGenerationLiteralValue {
        __typename
        value
        references {
            __typename
            signature
            value {
                ...AiGenerationNodeValueNested
            }
        }
    }
    ... on AiGenerationReferenceValue {
        ...AiGenerationReferenceValueFields
    }
    ... on AiGenerationSubFlowValue {
        ...AiGenerationSubFlowValueFields
        parameters {
            __typename
            identifier
            cast
            value {
                ...AiGenerationNodeValueNested
            }
        }
    }
}
