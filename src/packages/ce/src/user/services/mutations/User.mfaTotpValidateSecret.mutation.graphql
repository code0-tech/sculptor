#import "@edition/user/services/fragments/User.basic.fragment.graphql"
mutation mfaTotpValidateSecret($currentTotp: String!, $secret: String!) {
    usersMfaTotpValidateSecret(input: {
        currentTotp: $currentTotp
        secret: $secret
    }) {
        errors {
            ...on Error {
                errorCode,
                details {
                    __typename
                }
            }
        }
        user {
            ...UserBasic
        }
    }
}
