#import "@edition/user/services/fragments/User.basic.fragment.graphql"
mutation identityLogin($providerId: String!, $args: IdentityInput!) {
    usersIdentityLogin(input: {
        providerId: $providerId
        args: $args
    }) {
        errors {
            ...on Error {
                errorCode,
                details {
                    __typename
                }
            }
        }
        userSession {
            updatedAt
            token
            active
            createdAt
            id
            user {
                ...UserBasic
            }
        }
    }
}
