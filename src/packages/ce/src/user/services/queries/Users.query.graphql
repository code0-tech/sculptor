#import '../fragments/User.fragment.graphql'
#import '../fragments/User.basic.fragment.graphql'

query Users(
    $firstUser: Int,
    $afterUser: String,
    $firstIdentity: Int,
    $afterIdentity: String,
    $firstSession: Int,
    $afterSession: String,
    $firstNamespaceMembership: Int,
    $afterNamespaceMembership: String
) {
    currentUser {
        ...User
        mfaStatus {
            enabled
            totpEnabled
            backupCodesCount
        }
    }
    users (first: $firstUser, after: $afterUser) {
        count
        nodes {
            ...UserBasic
        }
        pageInfo {
            endCursor
            hasNextPage
        }
    }
}