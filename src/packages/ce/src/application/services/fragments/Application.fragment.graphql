#import "@edition/application/services/fragments/IdentityProvider.fragment.graphql"

fragment Application on Application {
    __typename
    metadata {
        __typename
        extensions
        version
    }
    legalNoticeUrl
    privacyUrl
    termsAndConditionsUrl
    settings {
        __typename
        termsAndConditionsUrl
        privacyUrl
        legalNoticeUrl
        adminStatusVisible
        organizationCreationRestricted
        userRegistrationEnabled
        runtimeMaxHeartbeatIntervalMinutes
        identityProviders(first: $firstIdentityProvider, after: $afterIdentityProvider) {
            __typename
            count
            pageInfo {
                endCursor
                hasNextPage
            }
            nodes {
                ...IdentityProvider
            }
        }
    }
    userAbilities {
        __typename
        createOrganization
        createRuntime
        deleteRuntime
        rotateRuntimeToken
        updateApplicationSetting
        updateRuntime
    }
}