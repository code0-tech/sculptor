fragment ApplicationLicense on License {
    __typename
    id
    createdAt
    updatedAt
    startDate
    endDate
    licensee

    options {
        __typename
        customerType
        paymentPeriod
        plan
    }

    restrictions {
        __typename
        aiTokens
        workflowExecutions
    }

    userAbilities {
        __typename
        deleteLicense
    }
}