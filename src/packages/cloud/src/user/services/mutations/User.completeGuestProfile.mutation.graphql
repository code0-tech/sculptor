#import "@edition/user/services/fragments/User.basic.fragment.graphql"
mutation completeGuestProfile($claimToken: String!, $username: String!, $firstname: String, $lastname: String, $password: String!, $passwordRepeat: String!) {
    usersCompleteGuestProfile(input: {
        claimToken: $claimToken
        username: $username
        firstname: $firstname
        lastname: $lastname
        password: $password
        passwordRepeat: $passwordRepeat
    }) {
        errors {
            ...on Error {
                errorCode,
                details {
                    __typename
                }
            }
        }
        userSession {
            updatedAt
            token
            active
            createdAt
            id
            user {
                ...UserBasic
            }
        }
    }
}
